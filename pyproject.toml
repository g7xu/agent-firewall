[project]
name = "agent-firewall"
version = "0.1.0"
description = "A hybrid firewall that keeps sensitive agent data local and asks your phone before risky actions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pyobjc-framework-vision>=10 ; sys_platform == 'darwin'",
    "python-dotenv>=1.0",
    "segno>=1.6",
    "uvicorn>=0.30",
]

[project.scripts]
agent-firewall = "agent_firewall.main:main"

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_firewall"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
